[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transformers-v5-migrate"
version = "0.1.1"
readme = "README.md"
description = "Codemod and risk report for moving Hugging Face Transformers v4 training and inference code (scripts, notebooks, dependency files) to v5."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["transformers", "huggingface", "migration", "codemod", "libcst", "v5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "libcst>=1.9,<2",
  "packaging>=26",
]

[project.scripts]
transformers-v5-migrate = "transformers_v5_migrate.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["src/transformers_v5_migrate"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = ["integration: needs transformers==5.23.0 installed (no torch required)"]
