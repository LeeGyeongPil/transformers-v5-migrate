# Hooks for https://pre-commit.com. Add to .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/LeeGyeongPil/transformers-v5-migrate
#       rev: v0.1.0
#       hooks:
#         - id: transformers-v5-migrate          # fail when something would break on v5
#         # - id: transformers-v5-migrate-fix    # or: apply the automatic fixes
- id: transformers-v5-migrate
  name: transformers-v5-migrate (check)
  description: Report Hugging Face Transformers v4 code that breaks or changes behavior on v5.
  entry: transformers-v5-migrate --no-diff
  language: python
  types: [text]
  files: '(\.py|\.ipynb|\.sh|\.bash|\.ya?ml|\.json|\.toml|\.txt|\.env(\..+)?|Dockerfile.*|Makefile)$'
- id: transformers-v5-migrate-fix
  name: transformers-v5-migrate (fix)
  description: Apply the mechanical Transformers v4 to v5 fixes to Python files and notebooks.
  entry: transformers-v5-migrate --write --no-diff --fail-on never
  language: python
  files: '\.(py|ipynb)$'
