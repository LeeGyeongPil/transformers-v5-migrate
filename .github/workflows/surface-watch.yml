# Weekly: compare the newest transformers 5.x with the rule evidence committed in this repo.
# A red run means a new v5.x release changed something the rules depend on:
# update rules.py (and TARGET_VERSION), run scripts/refresh_surface.py without --check, then the tests.
name: surface-watch
on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Install the old (4.57.1) and the newest 5.x transformers in two throw-away environments
        run: |
          uv venv -q --python 3.12 "$RUNNER_TEMP/tv4"
          uv pip install -q --python "$RUNNER_TEMP/tv4/bin/python" "transformers==4.57.1"
          uv venv -q --python 3.12 "$RUNNER_TEMP/tv5"
          uv pip install -q --python "$RUNNER_TEMP/tv5/bin/python" "transformers>=5,<6"
      - name: Compare with the committed snapshot
        run: |
          python3 scripts/refresh_surface.py --check \
            --v4-python "$RUNNER_TEMP/tv4/bin/python" \
            --v5-python "$RUNNER_TEMP/tv5/bin/python"
